name: Lab Submission
description: Submit completed lab exercises for a session
title: "Session [NUMBER] Labs - [YOUR NAME]"
labels: ["lab-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## Lab Submission Form
        Complete this form to submit your lab exercises for review.

  - type: dropdown
    id: session
    attributes:
      label: Session Number
      description: Which session are you submitting?
      options:
        - Session 1 - Introduction to Agentic AI
        - Session 2 - AI Coding Assistants & Vibe Coding
        - Session 3 - Reasoning, Planning & Tool Use
        - Session 4 - LangChain Fundamentals
        - Session 5 - Building RAG Applications
        - Session 6 - LangChain Agents & Memory
        - Session 7 - LangGraph Stateful Workflows
        - Session 8 - Advanced LangGraph Workflows
        - Session 9 - Multi-Agent Systems
        - Session 10 - Observability Fundamentals
        - Session 11 - Production Development & Deployment
        - Session 12 - LangFuse Observability
        - Session 13 - Model Context Protocol (MCP)
        - Session 14 - AI Safety & Guardrails
        - Session 15 - Capstone Project
    validations:
      required: true

  - type: checkboxes
    id: labs-completed
    attributes:
      label: Labs Completed
      description: Check all labs you have completed
      options:
        - label: Lab 01
        - label: Lab 02
        - label: Lab 03
        - label: Lab 04
        - label: Lab 05
        - label: Lab 06
        - label: Lab 07
        - label: Lab 08
        - label: Lab 09 (if applicable)

  - type: textarea
    id: submission-method
    attributes:
      label: Submission Files
      description: |
        Choose ONE of these methods to submit your completed notebooks:

        **Option 1:** Attach .ipynb files as comments below (after creating this issue)
        **Option 2:** Provide Google Drive/Dropbox link with shared access
        **Option 3:** Provide GitHub Gist links for each notebook
        **Option 4:** Paste notebook outputs as code blocks in comments

        Enter your chosen method and links here:
      placeholder: |
        Method: Google Drive
        Link: https://drive.google.com/...
    validations:
      required: true

  - type: textarea
    id: challenges
    attributes:
      label: Challenges Faced (Optional)
      description: Any difficulties or questions you encountered during the labs?
      placeholder: |
        - Lab 03 TODO section was unclear about...
        - Had issues with ChromaDB installation...

  - type: textarea
    id: additional-notes
    attributes:
      label: Additional Notes (Optional)
      description: Any other comments or feedback
      placeholder: Great session! Learned a lot about...

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-Submission Checklist
      description: Verify before submitting
      options:
        - label: All validation checks ([PASS]) are successful
          required: true
        - label: Code runs without errors
          required: true
        - label: Files are attached or links are provided
          required: true
